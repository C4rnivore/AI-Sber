name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  pep8-check:
    name: PEP8 Style Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install PEP8 checkers
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      
      - name: PEP8 check with flake8
        run: |
          flake8 backend/ --config=setup.cfg --statistics --count

  backend-lint:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black mypy types-requests fastapi starlette pydantic
          if [ -f model/requirements.txt ]; then
            pip install -r model/requirements.txt
          fi
      
      - name: Check code formatting with black
        run: |
          black --check --diff backend/ main.py || true
      
      - name: Lint with flake8
        run: |
          flake8 backend/ main.py --max-line-length=100 --extend-ignore=E203,W503 || true
      
      - name: Type check with mypy
        run: |
          mypy backend/ main.py --ignore-missing-imports || true

  frontend-lint:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Run ESLint
        run: bun run lint
      
      - name: Check TypeScript types
        run: bunx tsc --noEmit
      
      - name: Build Next.js app
        run: bun run build
        env:
          NODE_ENV: production

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          swap-storage: true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restore model cache
        uses: actions/cache@v4
        id: model-cache
        with:
          path: backend/mbart
          key: mbart-v1-${{ hashFiles('backend/model_downloader.py') }}
          restore-keys: |
            mbart-v1-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx
          # CPU-only PyTorch (~200 MB вместо ~4 GB с CUDA) — хватает для inference в CI
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          grep -v '^torch' backend/requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt

      - name: Download model weights
        if: steps.model-cache.outputs.cache-hit != 'true'
        working-directory: ./backend
        env:
          DOWNLOAD_OCR: "0"
        run: python model_downloader.py

      - name: Run tests
        env:
          TESTING: "1"
        run: |
          pytest backend/tests.py -v

